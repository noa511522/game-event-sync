<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームイベント管理ダッシュボード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712 !important;
            color: #f8fafc !important;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- ヘッダー -->
        <header class="mb-8 relative flex flex-col items-center">
            <!-- 最終更新日時（右上） -->
            <div id="last-updated" class="absolute top-0 right-0 hidden md:flex items-center gap-1.5 text-xs text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-800 shadow-inner">
                <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>最終更新: <strong id="update-time-text" class="text-slate-200">読み込み中...</strong></span>
            </div>

            <div class="inline-flex items-center justify-center p-3 bg-indigo-500/10 rounded-2xl text-indigo-400 mb-3 border border-indigo-500/20 shadow-lg shadow-indigo-500/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-white mb-1 tracking-tight">ゲームイベント ダッシュボード</h1>
            <p class="text-sm text-slate-400">スプレッドシートと連動した最新のイベント情報</p>
            
            <!-- スマホ用の最終更新表示 -->
            <div id="last-updated-mobile" class="mt-3 md:hidden text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">
                最終更新: <span id="update-time-text-mobile" class="text-slate-200">読み込み中...</span>
            </div>
        </header>

        <!-- 検索 & アプリタブのコントロール -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-xl">
            <div id="app-tabs" class="flex flex-wrap gap-2 justify-center">
                <span class="text-xs text-slate-400 py-2">タブを読み込んでいます...</span>
            </div>
            <div class="w-full md:w-72 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="search-box" placeholder="イベント名や詳細で検索..." oninput="filterEvents()" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-950 text-slate-100 placeholder-slate-500 shadow-inner transition">
            </div>
        </div>

        <!-- イベント一覧グリッド -->
        <div id="event-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- カードがここに動的に挿入されます -->
        </div>

        <!-- データなし・ローディング表示 -->
        <div id="loading" class="text-center py-20 text-slate-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
            <p>スプレッドシートからデータを読み込んでいます...</p>
        </div>
    </div>

    <!-- 詳細ポップアップ（モーダル） -->
    <div id="event-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300 relative text-slate-100" id="modal-content-box">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 rounded-full transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modal-app-badge" class="inline-block px-3 py-1 rounded-lg text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-3"></div>
            <h2 id="modal-title" class="text-xl font-bold text-white mb-3 leading-snug"></h2>
            <div class="flex items-center gap-4 text-xs text-slate-300 mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800">
                <div>開始: <span id="modal-start" class="font-semibold text-indigo-400"></span></div>
                <div>終了: <span id="modal-end" class="font-semibold text-amber-400"></span></div>
            </div>
            <div class="max-h-60 overflow-y-auto pr-2 mb-6">
                <p id="modal-description" class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"></p>
            </div>
            <div class="flex justify-between items-center pt-4 border-t border-slate-800">
                <button onclick="deleteCurrentEvent()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    このタスクを削除
                </button>
                <button onclick="closeModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // ★ここにあなたのGASの「ウェブアプリのURL」を貼り付けてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyke6CdnShEXeWLetkp4B8lynUU4fgQ4TT22wIcUEjNc1oibpdVj6XYJyKI4oCSfH2O/exec";

        let allEvents = [];
        let currentApp = 'ALL';
        let lastUpdatedTime = '';
        let currentSelectedEvent = null; // 現在モーダルで開いているイベント情報

        async function fetchEvents() {
            const loading = document.getElementById('loading');
            try {
                if (GAS_URL.includes("YOUR_GAS_WEB_APP_URL")) {
                    throw new Error("GASのウェブアプリURLが設定されていません。");
                }

                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                allEvents = data.events || data;
                lastUpdatedTime = data.last_updated || '不明';
                
                document.getElementById('update-time-text').innerText = lastUpdatedTime;
                document.getElementById('update-time-text-mobile').innerText = lastUpdatedTime;

                loading.style.display = 'none';
                
                buildTabs();
                renderEvents(allEvents);
            } catch (err) {
                loading.innerHTML = `<div class="bg-red-950/50 border border-red-800 p-4 rounded-2xl text-red-300 text-sm inline-block"><strong class="font-bold">データの読み込みに失敗しました</strong><br>${err.message}</div>`;
            }
        }

        function buildTabs() {
            const tabsContainer = document.getElementById('app-tabs');
            const apps = [...new Set(allEvents.map(e => e.app_name))];
            
            let html = `<button onclick="filterApp('ALL')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold ${currentApp === 'ALL' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:bg-slate-800'} transition">すべて (${allEvents.length})</button>`;
            
            apps.forEach(app => {
                const count = allEvents.filter(e => e.app_name === app).length;
                const isActive = currentApp === app;
                html += `<button onclick="filterApp('${app}')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold ${isActive ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:bg-slate-800'} transition">${app} (${count})</button>`;
            });
            
            tabsContainer.innerHTML = html;
        }

        function filterApp(app) {
            currentApp = app;
            buildTabs();
            filterEvents();
        }

        function filterEvents() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const filtered = allEvents.filter(e => {
                const matchApp = currentApp === 'ALL' || e.app_name === currentApp;
                const matchKeyword = e.title.toLowerCase().includes(keyword) || (e.description && e.description.toLowerCase().includes(keyword)) || e.app_name.toLowerCase().includes(keyword);
                return matchApp && matchKeyword;
            });
            renderEvents(filtered);
        }

        function renderEvents(events) {
            const grid = document.getElementById('event-grid');
            if (events.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 bg-slate-900/50 rounded-3xl border border-slate-800 shadow-inner"><p class="text-base">該当するイベントはありません。</p></div>`;
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let html = '';
            events.forEach((e) => {
                const escapedTitle = e.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                const escapedDesc = (e.description || '詳細なし').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                
                let isUrgent = false;
                if (e.end_date) {
                    const endDateObj = new Date(e.end_date);
                    endDateObj.setHours(0, 0, 0, 0);
                    const diffTime = endDateObj - today;
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    if (diffDays >= 0 && diffDays <= 7) {
                        isUrgent = true;
                    }
                }

                const cardBorder = isUrgent ? 'border-amber-500/60 shadow-lg shadow-amber-500/10 bg-gradient-to-br from-slate-900 to-amber-950/20' : 'border-slate-800 hover:border-indigo-500/50 bg-slate-900/90 shadow-sm';
                const endDateHtml = e.end_date ? `<div>終了: <span class="font-medium text-amber-400">${e.end_date}</span></div>` : `<div>終了: <span class="text-slate-500">未設定</span></div>`;

                // イベントオブジェクトをエスケープして安全に渡すため、インデックス経由でopenModalを呼ぶように変更
                const eventJson = JSON.stringify(e).replace(/"/g, '&quot;').replace(./g, c => c);
                
                html += `
                    <div onclick='openModal(${JSON.stringify(e)})' class="${cardBorder} rounded-2xl p-5 border transition duration-200 flex flex-col justify-between cursor-pointer group relative overflow-hidden">
                        ${isUrgent ? '<div class="absolute top-0 right-0 bg-amber-500 text-slate-950 text-[10px] font-extrabold px-2.5 py-0.5 rounded-bl-xl tracking-wider shadow">⚠️ 終了間近</div>' : ''}
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-indigo-500/15 text-indigo-300 border border-indigo-500/20 group-hover:bg-indigo-600 group-hover:text-white transition">${e.app_name}</span>
                                <div class="text-right text-[11px] text-slate-400 space-y-0.5 ${isUrgent ? 'mr-14' : ''}">
                                    <div>開始: <span class="font-medium text-slate-300">${e.start_date || '未設定'}</span></div>
                                    ${endDateHtml}
                                </div>
                            </div>
                            <h3 class="font-bold text-white mb-2 text-base leading-snug group-hover:text-indigo-400 transition">${e.title}</h3>
                            <p class="text-xs text-slate-400 leading-relaxed line-clamp-2">${e.description || '詳細なし'}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/80 flex justify-between items-center text-[11px] text-slate-400">
                            <span>詳細を見る</span>
                            <span class="text-indigo-400 font-medium group-hover:translate-x-1 transition">&rarr;</span>
                        </div>
                    </div>`;
            });
            grid.innerHTML = html;
        }

        function openModal(eventObj) {
            currentSelectedEvent = eventObj; // 削除用に保持

            document.getElementById('modal-app-badge').innerText = eventObj.app_name;
            document.getElementById('modal-title').innerText = eventObj.title;
            document.getElementById('modal-start').innerText = eventObj.start_date || '未設定';
            document.getElementById('modal-end').innerText = eventObj.end_date || '未設定';
            document.getElementById('modal-description').innerText = eventObj.description || '詳細なし';

            const modal = document.getElementById('event-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content-box').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('event-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-content-box').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
            currentSelectedEvent = null;
        }

        // 削除ボタンが押された時の処理
        async function deleteCurrentEvent() {
            if (!currentSelectedEvent) return;

            // 確認ダイアログを表示
            const confirmed = window.confirm(`「${currentSelectedEvent.title}」を本当に削除しますか？\n（スプレッドシートからも削除されます）`);
            if (!confirmed) return;

            try {
                // ローディング演出など（必要に応じて）
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' }, // GASでのCORSエラー回避のためtext/plain指定
                    body: JSON.stringify({
                        action: 'delete',
                        app_name: currentSelectedEvent.app_name,
                        title: currentSelectedEvent.title
                    })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    // 画面上の配列からも削除
                    allEvents = allEvents.filter(e => !(e.app_name === currentSelectedEvent.app_name && e.title === currentSelectedEvent.title));
                    
                    closeModal();
                    buildTabs();
                    filterEvents();
                    
                    alert('タスクを削除しました。');
                } else {
                    throw new Error(result.message || '削除に失敗しました');
                }
            } catch (err) {
                alert('削除エラー: ' + err.message);
            }
        }

        document.getElementById('event-modal').addEventListener('click', (e) => {
            if (e.target.id === 'event-modal') {
                closeModal();
            }
        });

        // ページ読み込み時にデータ取得
        fetchEvents();
    </script>
</body>
</html>
